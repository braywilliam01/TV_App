# TV Launcher config. Save this file and the launcher reloads by itself.
# You can also edit it on the TV: Settings (gear, top right) > Edit apps.
#
# Each app needs:
#   name:    text under the tile
#   command: what to run (anything you could type in a terminal)
#     - or -
#   url:     a web page, opened with `settings.browser`
#     - or -
#   action:  a built-in action. `minimize` hides the launcher and shows the desktop
#            (open "TV Launcher" from the app menu or taskbar to bring it back)
#   icon:    (optional) any of:
#              - a local image, relative to this file:  icons/netflix.png  (or a full path)
#              - a web image:  https://example.com/logo.png  (downloaded once, then kept offline)
#              - an installed app's icon name (Flatpak apps use their ID, e.g. tv.kodi.Kodi)
#            No icon = the first letter of the name is shown.
#
# Groups: give an entry its own `apps:` list instead of a command. It becomes a tile that
# opens a second screen with those apps (Back or the "‹ Back" tile returns). Groups can
# contain groups.

settings:
  title: "Living Room"
  theme: midnight          # midnight, ocean, forest, sunset, light, contrast (or pick in Settings > Themes)
  columns: auto            # auto = fit the screen, or a number like 4
  fullscreen: true
  show_clock: true
  # Opens `url:` apps. Kiosk mode = fullscreen with no browser bars (exit with Alt+F4).
  browser: "flatpak run org.mozilla.firefox --kiosk"

  # Optional: override single theme colours.
  # accent: "#3d9cff"
  # background: "#0f1216"
  # tile: "#1b2027"
  # text: "#e8ecf1"

  # Optional: power commands used by the Settings menu (these are the defaults).
  # shutdown_command: systemctl poweroff
  # restart_command: systemctl reboot
  # sleep_command: systemctl suspend

  # Optional: idle screensaver. Any key, click or pointer move dismisses it.
  # screensaver_minutes: 10          # minutes of inactivity before it starts; 0 (default) turns it off
  # screensaver_interval: 8          # seconds each image is shown
  # screensaver_source: bundled      # "bundled" (a free rotating photo set) or "folder"
  # screensaver_folder: "~/Pictures" # used when screensaver_source is "folder"

apps:
  - name: Kodi
    command: flatpak run tv.kodi.Kodi
    icon: tv.kodi.Kodi

  - name: Jellyfin
    command: flatpak run com.github.iwalton3.jellyfin-media-player
    icon: com.github.iwalton3.jellyfin-media-player

  - name: Games
    icon: icons/games.png
    apps:
      - name: Steam
        command: steam steam://open/bigpicture
        icon: steam

      - name: RetroDECK
        command: flatpak run net.retrodeck.retrodeck
        icon: net.retrodeck.retrodeck

  - name: Streaming
    icon: icons/streaming.png
    apps:
      - name: YouTube
        url: https://www.youtube.com
        icon: icons/youtube.png

      - name: Netflix
        url: https://www.netflix.com
        icon: icons/netflix.png

  - name: Firefox
    command: flatpak run org.mozilla.firefox
    icon: org.mozilla.firefox

  - name: Desktop
    action: minimize
    icon: user-desktop
